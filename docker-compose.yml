services:
  postgres:
    image: postgres:16-alpine
    container_name: kalshi_postgres
    environment:
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi_secure_password
      POSTGRES_DB: kalshi_trading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalshi -d kalshi_trading"]
      interval: 10s
      timeout: 5s
      retries: 5

  trading_bot:
    build: .
    container_name: kalshi_bot
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      POSTGRES_HOST: postgres
      POSTGRES_USER: kalshi
      POSTGRES_PASSWORD: kalshi_secure_password
      POSTGRES_DB: kalshi_trading
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
